{% extends "base.html" %}

{% block title %}AUTHVANTA | Forgot Password{% endblock %}

{% block content %}
<main class="auth-page">
    <section class="auth-card">
        <div class="auth-header">
            <div class="auth-icon">🔑</div>
            <span class="mfa-eyebrow">ACCOUNT RECOVERY</span>
            <h2>Forgot Password?</h2>
            <p>Don't worry. We'll help you securely recover your account.</p>
        </div>

        <form method="POST" class="auth-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label for="email">Registered Email Address</label>
                <input type="email" id="email" name="email"
                       placeholder="Enter your registered email"
                       autocomplete="email" maxlength="120" required>
            </div>

            <button type="submit" class="auth-button">
                REQUEST PASSWORD RESET <span>→</span>
            </button>
        </form>

        <div class="auth-footer">
            <a href="{{ url_for('auth.login') }}">← Back to Login</a>
        </div>
    </section>
</main>
{% endblock %}
