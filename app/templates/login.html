
{% extends "base.html" %}
{% block title %}AUTHVANTA | Login{% endblock %}

{% block content %}
<main class="auth-page">
    <section class="auth-card">

        <div class="auth-header">
            <div class="auth-icon">🔐</div>
            <h2>Welcome Back</h2>
            <p>Sign in to your AUTHVANTA account</p>
        </div>

        <form method="POST" class="auth-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <div class="auth-options">
                <a href="{{ url_for('password_reset.forgot_password') }}">
                    Forgot Password?
                </a>
            </div>

            <button type="submit" class="auth-button">
                LOGIN <span>→</span>
            </button>
        </form>

        <div class="verification-resend">
            <p>Didn't receive your verification email?</p>

            <form
                method="POST"
                action="{{ url_for('auth.resend_verification') }}"
                class="resend-form"
            >
                <input
                    type="hidden"
                    name="csrf_token"
                    value="{{ csrf_token() }}"
                >

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your registered email"
                    autocomplete="email"
                    required
                >

                <button type="submit" class="resend-button">
                    RESEND VERIFICATION EMAIL
                </button>
            </form>
        </div>

        <div class="auth-footer">
            <p>Don't have an account?</p>
            <a href="{{ url_for('auth.register') }}">Create Account</a>
        </div>

        <div class="auth-footer admin-portal-link">
            <p>Administrator?</p>
            <a href="{{ url_for('admin.login') }}">Admin Portal →</a>
        </div>

    </section>
</main>
{% endblock %}
